<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#667eea">
  <title>你说我猜</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 首页 -->
  <section id="view-home" class="view active">
    <div class="container">
      <div class="home-content">
        <h1 class="title">🎉 你说我猜</h1>
        <p class="subtitle">选词 · 描述 · 猜词 · 开心</p>
        <button id="btn-start" class="btn btn-primary btn-lg">开始游戏</button>
        <div class="home-footer">
          <span id="total-remaining" class="info-text"></span>
          <button id="btn-reset" class="btn btn-ghost btn-sm">🔄 重置词库</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 设置页 (整合类别、难度、时长) -->
  <section id="view-setup" class="view">
    <div class="container setup-container">
      <div class="page-header">
        <button id="btn-setup-back" class="btn btn-icon">←</button>
        <h2>游戏设置</h2>
        <span></span>
      </div>
      
      <div class="setup-scroll-area">
        <!-- 类别 -->
        <h3 class="setup-title">1. 选择类别 (可多选)</h3>
        <div id="cat-grid" class="cat-grid"></div>

        <!-- 难度 -->
        <h3 class="setup-title">2. 选择难度</h3>
        <div id="diff-group" class="pill-group">
          <button class="pill-btn" data-diff="easy">简单</button>
          <button class="pill-btn" data-diff="medium">中等</button>
          <button class="pill-btn" data-diff="hard">困难</button>
          <button class="pill-btn selected" data-diff="all">混合</button>
        </div>

        <!-- 时长 -->
        <h3 class="setup-title">3. 选择时长</h3>
        <div id="dur-group" class="pill-group">
          <button class="pill-btn selected" data-idx="0">2分钟</button>
          <button class="pill-btn" data-idx="1">3分钟</button>
          <button class="pill-btn" data-idx="2">5分钟</button>
        </div>
      </div>

      <div class="page-footer">
        <button id="btn-setup-start" class="btn btn-primary btn-lg" disabled>开始游戏</button>
      </div>
    </div>
  </section>

  <!-- 游戏中 -->
  <section id="view-playing" class="view">
    <div class="container game-container">
      <div class="game-header-top">
        <button id="btn-exit" class="btn btn-icon btn-sm">← 退出</button>
      </div>
      <div class="game-top">
        <div class="timer-wrap">
          <div class="timer-bar-bg">
            <div id="timer-bar" class="timer-bar"></div>
          </div>
          <span id="timer-text" class="timer-text">0:00</span>
        </div>
        <div class="game-stats">
          <span class="stat">✅ <span id="score-display">0</span></span>
        </div>
      </div>

      <div class="word-area">
        <div id="word-category" class="word-category-label"></div>
        <div id="current-word" class="current-word">准备</div>
      </div>

      <div class="game-actions">
        <button id="btn-skip" class="btn btn-skip">
          ⏭️ 跳过 (<span class="skip-count">2</span>)
        </button>
        <button id="btn-correct" class="btn btn-correct">
          ✅ 猜对了！
        </button>
      </div>
    </div>
  </section>

  <!-- 结算 -->
  <section id="view-result" class="view">
    <div class="container">
      <div class="page-header">
        <button id="btn-result-back" class="btn btn-icon">←</button>
        <h2>结算</h2>
        <span></span>
      </div>

      <div id="result-badge" class="result-badge pass" style="margin-top: 16px;">🎉 达标！</div>

      <div class="result-stats">
        <div class="result-stat">
          <div class="stat-num" id="result-correct">0</div>
          <div class="stat-label">猜对</div>
        </div>
        <div class="result-stat">
          <div class="stat-num" id="result-skipped">0</div>
          <div class="stat-label">跳过</div>
        </div>
        <div class="result-stat">
          <div class="stat-num" id="result-threshold">0</div>
          <div class="stat-label">目标</div>
        </div>
      </div>

      <div class="result-section">
        <h3>✅ 猜对的词</h3>
        <div id="result-words" class="result-word-list"></div>
      </div>

      <div id="skipped-section" class="result-section" style="display:none">
        <h3>⏭️ 跳过的词</h3>
        <div id="result-skipped-words" class="result-word-list"></div>
      </div>

      <div class="result-actions">
        <button id="btn-again" class="btn btn-primary btn-lg">再来一局 (同设置)</button>
        <button id="btn-home" class="btn btn-ghost">返回首页</button>
      </div>
    </div>
  </section>

  <script src="js/words.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
